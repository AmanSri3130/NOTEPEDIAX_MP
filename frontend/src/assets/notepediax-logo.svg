<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 85" width="100%" height="100%">
  <defs>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#8B0000" flood-opacity="1"/>
      <feDropShadow dx="3.5" dy="3.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Main NOTEPEDIAX Text -->
  <text 
    x="160" 
    y="48" 
    font-family="'Sora', 'Impact', 'Arial Black', sans-serif" 
    font-size="44" 
    font-weight="900" 
    font-style="italic" 
    letter-spacing="-1" 
    fill="#FF2E2E" 
    stroke="#8B0000" 
    stroke-width="0.8" 
    text-anchor="middle" 
    filter="url(#drop-shadow)"
    transform="skewX(-4) translate(3, 0)"
  >
    NOTEPEDIAX
  </text>
  
  <!-- Underline Bar -->
  <rect 
    x="12" 
    y="54" 
    width="296" 
    height="5.5" 
    rx="2.75" 
    fill="#FF2E2E" 
  />
  
  <!-- Tagline: Believe It -->
  <text 
    x="160" 
    y="76" 
    font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
    font-size="14" 
    font-weight="700" 
    letter-spacing="2" 
    fill="currentColor" 
    text-anchor="middle"
  >
    Believe It
  </text>
</svg>
